schema_version: 1
name: boston_empirical
baseline_run: current.json
output_directory: outputs/boston
inputs:
  cases_path: ../../boston_inputs/cases.parquet
  pairs_path: ../../boston_inputs/observed_pairs.parquet
seeds: [74001, 74002, 74003]
scorers: [EDD, EDS, ESD, ESS, GD_D, GD_S, LOGIT_D, LOGIT_S]
clustering:
  algorithms: [components, leiden]
  leiden:
    objective: CPM
    weight_policies: [binary, native]
    resolutions: [0.0001, 0.001, 0.01, 0.05, 0.1, 0.3, 0.5, 0.75, 1.0]
    restarts: 5
    seed: 65001
treecluster:
  enabled: false
