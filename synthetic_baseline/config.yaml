# Comprehensive baseline assessment configuration.
# Paths are relative to this file unless absolute.
source_config: ../config.yaml
output_directory: outputs
condition: matched
scenario: baseline
seeds: [12345]
training_seed: 54321
models: [EDD, EDS, ESD, ESS]

# Pairwise analysis settings
pairwise:
  selected_fractions: [0.0005, 0.001, 0.005, 0.01]
  recall_levels: [0.5, 0.7, 0.9]

# Cluster analysis settings
clusters:
  selected_fractions: [0.005]
  algorithms: [components, leiden]
  leiden_resolutions: [0.3]
  n_restarts: 10
  null_replicates: 20
  temporal_block_days: 7

# TreeCluster settings
treecluster:
  enabled: true
  resume_existing: false
  max_runtime_seconds: 600
  command_timeout_seconds: 120
  methods: [max_clade, avg_clade, single_linkage]
  threshold_days: [7, 14, 21, 28, 35, 42, 49, 56, 63, 70]
  genetic_thresholds: [0.0002, 0.0005, 0.001, 0.002, 0.003, 0.005]
  raw_trees:
    deterministic: ../phylo/synthetic/fastme_deterministic/fastme.nwk
    stochastic: ../phylo/synthetic/fastme_stochastic/fastme.nwk
  dated_trees:
    deterministic: ../phylo/synthetic/treetime_deterministic/timetree.nwk
    stochastic: ../phylo/synthetic/treetime_stochastic/timetree.nwk

# Validation settings
validation:
  compare_historical_baseline: true
  historical_scores: ../results/synthetic/baseline_scores.parquet
  lookup_prior_strength: 100.0

# Figure settings
figures:
  primary_selection_fraction: 0.005
  primary_cluster_fraction: 0.005
  max_time_days: 30
  max_genetic_distance: 15

# Full sweep mode (use --full-sweep flag to enable)
full_sweep:
  clusters_resolutions: [0.1, 0.3, 0.5, 0.7, 1.0]
  pairwise_thresholds: [0.0001, 0.1, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5]
