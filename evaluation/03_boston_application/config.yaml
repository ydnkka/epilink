schema_version: 1
name: boston_empirical
baseline_run: ../01_synthetic_baseline/outputs/baseline/current.json
output_directory: outputs/boston
inputs:
  data_root: ../../data
  # Shared prepared inputs, independent of the run output directory.
  cases_path: outputs/inputs/cases.parquet
  pairs_path: outputs/inputs/observed_pairs.parquet
# All four EpiLink inference/observation rules, two genetic rules and two
# pretrained logistic rules are replayed on the same observed Boston GD/TD.
# S/D in synthetic source names denotes the original observation process;
# Boston has only one empirical distance vector. Nothing is refitted.
scorers: [EDD, EDS, ESD, ESS, GD_S, GD_D, LOGIT_S, LOGIT_D]
assessment:
  treecluster_path: null
  focus_exposures: [Conference, SNF]
  min_cluster_size: 2
trees:
  enabled: true
  # Trees are built from the Boston alignment.
  alignment_path: ../../data/raw/boston/MGH_DPH_98percent_772samples_aligned.fasta
