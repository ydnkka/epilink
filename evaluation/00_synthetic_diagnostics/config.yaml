schema_version: 1
name: synthetic_diagnostics
experiment_config: ../shared_synthetic/config.yaml
output_directory: outputs/diagnostics

diagnostics:
  backbone:
    superspreading_quantile: 0.99
    # Optional exploratory case-resampling intervals; the backbone is fixed.
    bootstrap_replicates: 0
    bootstrap_seed: 67001
  leiden:
    objective: CPM
    resolutions:
      min: 0.1
      max: 1.0
      initial_points: 8
      budget: 20
      scale: linear
    restarts: 5
    seed: 65001
