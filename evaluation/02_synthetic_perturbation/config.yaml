schema_version: 2
name: natural_history_perturbation
# Resolved once at startup; alternatively specify a runs/<id> directory.
baseline_run: ../01_synthetic_baseline/outputs/baseline/current.json
output_directory: outputs/perturbation
# Select updated full-graph Leiden resolutions on fresh development observations.
development_seeds: [80001, 80002, 80003]
# Evaluate all four modes on separate, paired observations.
seeds: [81001, 81002, 81003]
scorers: [EDD, EDS, ESD, ESS]
criterion: balanced_M0
modes:
  - baseline_inference_baseline_clustering
  - baseline_inference_updated_clustering
  - matched_inference_baseline_clustering
  - matched_inference_updated_clustering
perturbations:
  - parameter: incubation.mean
    multipliers: [0.75, 1.25]
  - parameter: incubation.cv
    multipliers: [0.75, 1.25]
  - parameter: testing_delay.mean
    multipliers: [0.75, 1.25]
  - parameter: testing_delay.cv
    multipliers: [0.75, 1.25]
  - parameter: substitution_rate
    multipliers: [0.75, 1.25]
  - parameter: relaxation
    values: [0.0, 0.66]
smoke:
  cases: 64
  seed: 91001
  development_seed: 90001
  parameters: [incubation.mean]
