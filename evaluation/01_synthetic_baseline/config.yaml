schema_version: 1
name: matched_baseline
output_directory: outputs/baseline
inputs:
  tree_path: ../../data/derived/scovmod/transmission_tree.gml
  infection_path: ../../data/raw/scovmod/InfectedIndividuals.1.csv
  transmission_path: ../../data/raw/scovmod/TransmissionEvents.1.csv
  target_component_size: 1000
  tree_seed: 12345
  smoke_cases: null
splits:
  train: [61001, 61002]
  development: [62001, 62002, 62003]
  evaluation: [63001, 63002, 63003]
generation: &natural_history
  incubation: {mean: 5.505036, cv: 0.4149770576}
  testing_delay: {mean: 1.0, cv: 1.0}
  latent_shape: 3.38
  symptomatic_rate: 0.37
  symptomatic_shape: 1.0
  transmission_rate_ratio: 2.29
  substitution_rate: 0.001
  relaxation: 0.33
  genome_length: 29903
inference: *natural_history
simulation:
  fraction_sampled: 1.0
  # Sequence length controls simulated sites; natural_history.genome_length
  # controls expected mutation counts in epilink 0.1.5 (legacy convention).
  sequence_length: 5000
scorer:
  mc_samples: 10000
  seed: 64001
  logistic_C: 1.0
scorers: [EDD, EDS, ESD, ESS, GD_D, GD_S, LOGIT_D, LOGIT_S]
thresholds:
  epilink: [0.0, 0.0001, 0.01, 0.05, 0.1, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0]
  genetic: [0, 1, 2, 3, 4, 5, 8, 12, 20, 60]
  logistic: [0.0, 0.0001, 0.001, 0.01, 0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 1.0]
pairwise:
  selected_fractions: [0.0005, 0.001, 0.005, 0.01]
clustering:
  algorithms: [components, leiden]
  leiden:
    objective: CPM
    weight_policies: [binary, native]
    resolutions: [0.0001, 0.001, 0.01, 0.05, 0.1, 0.3, 0.5, 0.75, 1.0, 1.5]
    restarts: 5
    seed: 65001
treecluster:
  enabled: true
  methods: [max_clade, avg_clade, single_linkage]
  genetic_thresholds: [0, 0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.02]
  threshold_days: [0, 7, 14, 21, 28, 42, 56, 70, 140, 365]
  days_per_year: 365.25
  fastme_method: N
  raw_rooting: midpoint
  negative_branches: clip_zero
  clock_filter: 0
  rng_seed: 66001
  command_timeout_seconds: 1800
  executables: {fastme: fastme, treetime: treetime, treecluster: TreeCluster.py}
selection:
  # Candidate criterion, not a previously selected operating point.
  # Add scientifically justified constraints after inspecting development curves.
  criteria:
    - name: balanced_M0
      objective: M0_f1
      constraints: {}
