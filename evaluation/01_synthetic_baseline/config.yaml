schema_version: 1
name: matched_baseline
output_directory: outputs/baseline
experiment_config: ../shared_synthetic/config.yaml
scorer:
  mc_samples: 10000
  seed: 64001
  logistic_C: 1.0
scorers: [EDD, EDS, ESD, ESS, GD_D, GD_S, LOGIT_D, LOGIT_S]
clustering:
  algorithms: [components, leiden]
  leiden:
    objective: CPM
    resolutions:
      min: 0.01
      max: 1.0
      initial_points: 8
      budget: 28
      scale: log
    restarts: 5
    seed: 65001
phylogeny:
  model: JC
  threads: 1
  seed: 66001
  clock_rate: null
  executable: iqtree
  timeout: 1800

treecluster:
  enabled: true
  methods: [max_clade, avg_clade, single_linkage]
  genetic_threshold_snps:
    min: 0
    max: 10
    initial_points: 4
    budget: 11
    scale: linear
  temporal_threshold_days:
    min: 0
    max: 105
    initial_points: 8
    budget: 28
    scale: linear
  timeout: 1800
  executable: TreeCluster.py
selection:
  # Candidate criterion, not a previously selected operating point.
  # Add scientifically justified constraints after inspecting development curves.
  criteria:
    # Primary endpoint: M=0 (direct transmission + shared infector)
    - name: balanced_M0
      objective: M0_f1
      constraints: {}

    # Secondary endpoint: M≤1 (AD0/AD1 and CA00/CA01)
    - name: balanced_Mle1
      objective: Mle1_f1
      constraints: {}

    # Tertiary endpoint: M≤2 (broader transmission network)
    - name: balanced_Mle2
      objective: Mle2_f1
      constraints: {}
