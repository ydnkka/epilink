# Paths are relative to this file. Experiment parameters remain in the source config.
source_config: ../config.yaml
output_directory: outputs
conditions: [matched]
scenarios: [baseline]
seeds: [12345]
models: [EDD, EDS, ESD, ESS]

scores:
  selected_fractions: [0.0005, 0.001, 0.005, 0.01]
  recall_levels: [0.5, 0.7, 0.9]
  # Raw target scores are sums, not probabilities; no division by two is applied.
  thresholds: [0.0001, 0.1, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5]
  bins: [0.0, 0.0001, 0.1, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.000001]

clusters:
  # Fixed before this exploration; the full sweep is reported, never optimised on truth.
  resolutions: [0.1, 0.3, 0.5, 0.7, 1.0]
  primary_resolution: 0.3
  n_restarts: 10
  minimum_weight: 0.0001
  null_replicates: 20
  temporal_block_days: 7
  # Descriptive horizons, not replacement definitions of a true target pair.
  hop_horizons: [2, 3, 5, 10]

validation:
  # Independent dates/genomes on the SAME tree: not independent epidemic topologies.
  training_seed: 54321
  lookup_prior_strength: 100.0
  compare_historical_baseline: true
  historical_scores: ../results/synthetic/baseline_scores.parquet

figures:
  max_time_days: 30
  max_genetic_distance: 15
